name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Version
        id: version
        run: |
          BASE="$(tr -d '[:space:]' < version.txt)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            NAME="$BASE"
          else
            NAME="$BASE-dev.${GITHUB_RUN_NUMBER}"
          fi
          # Publish when this is a tag build, or when main carries a version that has no release yet.
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE=true
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]] && \
               ! git ls-remote --exit-code --tags origin "refs/tags/v$NAME" >/dev/null 2>&1; then
            RELEASE=true
          fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "version $NAME (release: $RELEASE)"

      - name: Signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Repository secrets take priority when set.
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            {
              echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the key from repository secrets."
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ -f signing/foldterm-release.jks ]; then
            # Otherwise use the key committed in signing/.
            prop() { grep "^$1=" signing/release.properties | cut -d= -f2-; }
            {
              echo "SIGNING_KEYSTORE_PATH=$GITHUB_WORKSPACE/signing/foldterm-release.jks"
              echo "SIGNING_STORE_PASSWORD=$(prop storePassword)"
              echo "SIGNING_KEY_ALIAS=$(prop keyAlias)"
              echo "SIGNING_KEY_PASSWORD=$(prop keyPassword)"
            } >> "$GITHUB_ENV"
            echo "Signing with the key committed in signing/."
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key found; the APK will be unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify signature
        if: steps.keystore.outputs.signed == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/*/release/*.apk; do
            echo "== $apk"; "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Collect APK
        run: |
          mkdir -p dist
          SUFFIX=$([ "${{ steps.keystore.outputs.signed }}" = "true" ] && echo "" || echo "-unsigned")
          cp app/build/outputs/apk/full/release/*.apk "dist/foldterm-${{ steps.version.outputs.name }}${SUFFIX}.apk"
          cp app/build/outputs/apk/lite/release/*.apk "dist/foldterm-${{ steps.version.outputs.name }}-lite${SUFFIX}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v5
        with:
          name: foldterm-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Release skipped (no signing key)
        if: steps.version.outputs.release == 'true' && steps.keystore.outputs.signed != 'true'
        run: |
          echo "::warning::v${{ steps.version.outputs.name }} was built but not published: the signing secrets are not set. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD (see README), then re-run this workflow."
          {
            echo "### Release v${{ steps.version.outputs.name }} not published"
            echo "The APK built fine but is unsigned, and Android will not install an unsigned APK."
            echo "Add the four signing secrets under **Settings → Secrets and variables → Actions** (see the README), then click **Re-run all jobs**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        if: steps.version.outputs.release == 'true' && steps.keystore.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: FoldTerm v${{ steps.version.outputs.name }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            **Which APK?**
            - `foldterm-${{ steps.version.outputs.name }}.apk` — full edition, with Mail, Chat and now playing (reads notifications).
            - `foldterm-${{ steps.version.outputs.name }}-lite.apk` — everything else. Use this if your phone says the app "requests access to sensitive data" and won't install.

            Both are signed with the same key, so you can switch between them later without uninstalling.
