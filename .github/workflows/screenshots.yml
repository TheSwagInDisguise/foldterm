name: Screenshots

on:
  push:
    branches: [main]
    paths:
      - scripts/screenshots.sh
      - .github/workflows/screenshots.yml
      - app/src/main/java/dev/foldterm/launcher/Demo.kt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleFullDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture on a Pixel Fold emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_fold
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/screenshots.sh

      - uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: shots/
          if-no-files-found: error

      - name: Publish to the screenshots branch
        run: |
          git config user.name "TheSwagInDisguise"
          git config user.email "TheSwagInDisguise@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/out" && cp shots/*.png "$RUNNER_TEMP/out/"
          git checkout --orphan screenshots-out
          git rm -rf --quiet --cached .
          git clean -fdxq
          cp "$RUNNER_TEMP"/out/*.png .
          git add *.png
          git commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -f origin HEAD:screenshots
